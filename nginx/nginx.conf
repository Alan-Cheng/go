worker_processes  1;

events { worker_connections  1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;

        # Static UI
        root /usr/share/nginx/html;
        index index.html;

        # Reverse proxy to nodes to avoid CORS
        location /api/node0/ {
            proxy_pass http://node0:8080/;
        }

        location /api/node1/ {
            proxy_pass http://node1:8081/;
        }

        location /api/node2/ {
            proxy_pass http://node2:8082/;
        }

        # Cache busting for static
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}


